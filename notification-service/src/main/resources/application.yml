server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/notifications_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.hemachandran.notificationservice.event.OrderCreatedEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.hemachandran.notificationservice.event

management:
  endpoints:
    web:
      exposure:
        include: health,info