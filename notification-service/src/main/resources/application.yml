server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3306/notifications_db
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info